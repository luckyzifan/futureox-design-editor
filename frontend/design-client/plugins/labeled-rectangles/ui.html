<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Labeled rectangles</title>
  <style>
    body { margin: 0; font: 13px/1.4 Inter, sans-serif; color: #262a31; background: #fff; }
    main { display: grid; gap: 10px; padding: 16px; }
    label { display: grid; gap: 4px; }
    input { padding: 6px 8px; border: 1px solid #e2e5e9; border-radius: 6px; }
    div { display: flex; gap: 8px; }
    button { padding: 8px 12px; border: 0; border-radius: 6px; background: #3459d4; color: #fff; }
    button.secondary { background: #f1f3f5; color: #262a31; }
  </style>
</head>
<body>
  <main>
    <label>Label <input id="label" value="Note"></label>
    <label>Count <input id="count" type="number" min="1" max="20" value="3"></label>
    <div>
      <button id="create" type="button">Create</button>
      <button id="cancel" class="secondary" type="button">Close</button>
    </div>
  </main>
  <script>
    document.getElementById('create').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'create', label: document.getElementById('label').value, count: Number(document.getElementById('count').value) } }, '*')
    }
    document.getElementById('cancel').onclick = () => parent.postMessage({ pluginMessage: { type: 'cancel' } }, '*')
  </script>
</body>
</html>
