<!doctype html><html><head><meta charset="utf-8"><title>Canvas chrome verification</title></head>
<body><h3 id="status">booting…</h3><pre id="result"></pre>
<script type="module">
// P2-2 验证:真机 WebGPU 跑 Figma 画布镶边(棋盘亮/暗/点背景),与 CPU 参照对照。
const report = (ok, text) => {
  document.getElementById('status').textContent = ok ? 'PASS' : 'FAIL'
  document.getElementById('result').textContent = text
}
try {
  if (!navigator.gpu) throw new Error('no webgpu')
  const adapter = await navigator.gpu.requestAdapter()
  const device = await adapter.requestDevice()
  device.addEventListener?.('uncapturederror', (ev) => window.__e = String(ev.error.message))
  device.pushErrorScope('validation')
  const WGSL = document.getElementById('wgsl').textContent
  const W = 128, H = 64, ZOOM = 1.0
  // 空内容纹理(棋盘纯底)— 与内核 checkerboard 语义一致:16px 双色
  const module = device.createShaderModule({ code: WGSL })
  const layout = device.createBindGroupLayout({ entries: [
    { binding: 0, visibility: GPUShaderStage.FRAGMENT | GPUShaderStage.VERTEX, buffer: { type: 'uniform' } },
    { binding: 1, visibility: GPUShaderStage.FRAGMENT, sampler: { type: 'filtering' } },
    { binding: 2, visibility: GPUShaderStage.FRAGMENT, texture: { sampleType: 'float' } }] })
  const pipeline = device.createRenderPipeline({ layout: device.createPipelineLayout({ bindGroupLayouts: [layout] }),
    vertex: { module, entryPoint: 'quad' }, fragment: { module, entryPoint: 'fragment', targets: [{ format: 'rgba8unorm' }] },
    primitive: { topology: 'triangle-list' } })
  const sampler = device.createSampler({ magFilter: 'linear', minFilter: 'linear' })
  const blank = device.createTexture({ size: [W, H], format: 'rgba8unorm',
    usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST })
  device.queue.writeTexture({ texture: blank }, new Uint8Array(W*H*4), { bytesPerRow: W*4 }, [W, H])
  const uniforms = new Float32Array(256)
  const ubuf = device.createBuffer({ size: 1024, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST })
  const checkerboardStyle = parseInt(new URLSearchParams(location.search).get('style') || '1')
  const scale = 1.0 / 16.0  // 棋盘 16px(与内核 checkerboard 同尺寸)
  uniforms.set([0, 0, W, H], 0)             // values[0] dstRect
  uniforms.set([checkerboardStyle, 0, 1, ZOOM], 36) // values[9]
  uniforms.set([0, scale, 0, 0], 40)        // values[10] gridData: 线粗 0 = 禁用网格线
  uniforms.set([1, 1, 1, 1], 44)            // values[11] pageColor
  uniforms.set([0.9, 0.9, 0.05, 0], 48)     // values[12] dot 参数
  device.queue.writeBuffer(ubuf, 0, uniforms)
  const bind = device.createBindGroup({ layout, entries: [
    { binding: 0, resource: { buffer: ubuf } }, { binding: 1, resource: sampler },
    { binding: 2, resource: blank.createView() }] })
  const out = device.createTexture({ size: [W, H], format: 'rgba8unorm',
    usage: GPUTextureUsage.RENDER_ATTACHMENT | GPUTextureUsage.COPY_SRC })
  const enc = device.createCommandEncoder()
  const pass = enc.beginRenderPass({ colorAttachments: [{ view: out.createView(), loadOp: 'clear', storeOp: 'store', clearValue: [0,0,0,0] }] })
  pass.setPipeline(pipeline); pass.setBindGroup(0, bind); pass.draw(3); pass.end()
  const rb = device.createBuffer({ size: Math.ceil(W*4/256)*256*H, usage: GPUBufferUsage.COPY_DST | GPUBufferUsage.MAP_READ })
  const rowBytes = Math.ceil(W*4/256)*256
  enc.copyTextureToBuffer({ texture: out }, { buffer: rb, bytesPerRow: rowBytes }, [W, H])
  device.queue.submit([enc.finish()])
  await rb.mapAsync(GPUMapMode.READ)
  const gpuBytes = new Uint8Array(rb.getMappedRange())
  // CPU 参照(内核 checkerboard 语义对照):
  // 棋盘 = fract(world*scale)-0.5 的叉积符号切换双色,world=设备像素(如 zoom=1)
  let maxDiff = 0, checked = 0
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    // 其着色器同式:fract(world * scale) - 0.5 的叉积符号(world = 像素中心)
    const wx = x + 0.5, wy = y + 0.5
    const fx = (wx * scale) % 1 - 0.5, fy = (wy * scale) % 1 - 0.5
    const bright = (fx * fy) < 0
    const expected = checkerboardStyle === 1 ? (bright ? 1.0 : 0.95) : (bright ? 0.12 : 0.17)
    const gi = y * rowBytes + x * 4
    for (let k = 0; k < 3; k++) {
      const d = Math.abs(gpuBytes[gi+k] / 255.0 - expected)
      maxDiff = Math.max(maxDiff, d); checked++
    }
  }
  const gpuErr = await device.popErrorScope().catch(() => null)
  report(maxDiff < 0.01 && !gpuErr,
    `style=${checkerboardStyle} W=${W} H=${H}\\nmaxDiff=${maxDiff.toFixed(6)} checked=${checked}\\n` +
    `gpu(0,0)=${[gpuBytes[0]/255,gpuBytes[1]/255,gpuBytes[2]/255].map(v=>v.toFixed(3))} gpu(16,0)=${[gpuBytes[16*4]/255,gpuBytes[16*4+1]/255,gpuBytes[16*4+2]/255].map(v=>v.toFixed(3))}\\n` +
    `gpuError=${gpuErr ? gpuErr.message : 'none'}\\ngate: maxDiff<0.01`)
} catch (e) { report(false, String(e)) }
</script>
<script type="text/plain" id="wgsl">
// Figma 画布镶边着色器。
// 算法事实:checkerboardStyle 四档(0=无,1=亮棋盘,2=暗棋盘,3=点背景);
// 棋盘两色是 1.0/0.95(亮)与 0.12/0.17(暗),按 fract(c*scale)-0.5 的叉积符号切换;
// 点背景的网格大小随 zoomScale 指数降档(32×16→16×16→…→1×16,基 16px);
// 网格线是亚像素十字线(a() 函数:粗细 <1px 的两条细线,亮度反演保护暗背景)。
struct Params { values: array<vec4<f32>, 64> }
@group(0) @binding(0) var<uniform> params: Params;
@group(0) @binding(1) var texSampler: sampler;
@group(0) @binding(2) var texture0: texture_2d<f32>;

@vertex
fn quad(@builtin(vertex_index) i: u32) -> @builtin(position) vec4<f32> {
  let x = f32((i << 1u) & 2u);
  let y = f32(i & 2u);
  return vec4<f32>(x * 2.0 - 1.0, 1.0 - y * 2.0, 0.0, 1.0);
}

// 其 z(float zoomScale):点背景网格大小的指数降档
fn dotGridSize(zoomScale: f32) -> f32 {
  let u = 16.0;
  if (zoomScale < 0.03125) { return 32.0 * u; }
  else if (zoomScale < 0.0625) { return 16.0 * u; }
  else if (zoomScale < 0.125) { return 8.0 * u; }
  else if (zoomScale < 0.25) { return 4.0 * u; }
  else if (zoomScale < 0.5) { return 2.0 * u; }
  else { return u; }
}

// 其 a(vec3 b, vec2 c, float d):网格十字线。d = 线粗(像素)
fn gridLines(b: vec3<f32>, c: vec2<f32>, d: f32) -> vec3<f32> {
  let e = fract(c);
  let f = max(f32(e.x < d), f32(e.y < d));
  var g: vec3<f32>;
  let h = vec3<f32>(0.299, 0.587, 0.114);           // 其亮度权重
  let i = dot(b * b, h);                             // 平方亮度(避免 sqrt)
  let j = sqrt(i);
  if (j > 0.5) {
    let k = (j - 0.05) / j;
    g = b * k;                                       // 亮背景:整体暗 5%
  } else {
    let k = j * 0.8 + 0.15;
    let l = dot(b, h);
    let m = 1.0 - 2.0 * l + i;
    let n = i - l;
    // 其根式选亮分支
    g = mix(b, vec3<f32>(1.0), (n + sqrt(n * n - m * (i - k * k))) / m);
  }
  return mix(b, g, f);
}

fn o1(p: f32) -> f32 { return floor(p + 0.5); }
fn o2(q: vec2<f32>) -> vec2<f32> { return floor(q + vec2<f32>(0.5)); }

@fragment
fn fragment(@builtin(position) position: vec4<f32>) -> @location(0) vec4<f32> {
  let dstRect = params.values[0];   // (x,y,w,h)
  let checkerboardStyle = i32(params.values[9].x);  // 0 无|1 亮|2 暗|3 点背景
  let unpremultiplyAlpha = params.values[9].y > 0.5;
  let alphaMultiplier = params.values[9].z;
  let zoomScale = params.values[9].w;
  let gridData = params.values[10].xy;               // (线粗 px, 棋盘 scale)
  let pageColor = params.values[11];                 // 底色(含 alpha)
  let dotBase = params.values[12].x;
  let dotZoomedOut = params.values[12].y;
  let dotColorDiff = params.values[12].z;
  // 世界坐标(其 _position4.xy 语义):设备像素 / zoomScale
  let world = position.xy / max(zoomScale, 1e-9);

  let uv = (position.xy + vec2<f32>(0.5)) / dstRect.zw;
  var am = textureSample(texture0, texSampler, uv) * alphaMultiplier;

  if (checkerboardStyle == 0) {
    if (unpremultiplyAlpha) {
      return vec4<f32>(am.rgb / max(am.a, 0.00001), am.a);
    }
    return am;
  }
  var ad: f32;
  let ac = gridData.y;
  if (checkerboardStyle == 1) {                      // 亮棋盘 1.0/0.95
    let ae = fract(world * ac) - vec2<f32>(0.5);
    ad = select(0.95, 1.0, ae.x * ae.y < 0.0);
  } else if (checkerboardStyle == 2) {               // 暗棋盘 0.12/0.17
    let ae = fract(world * ac) - vec2<f32>(0.5);
    ad = select(0.17, 0.12, ae.x * ae.y < 0.0);
  } else {                                           // 点背景
    let d = dotGridSize(zoomScale);
    let af = smoothstep(0.5, 1.0, zoomScale);
    let ag = dotZoomedOut + dotColorDiff * af;
    let ah = o2(world / d) * d;
    let ai = length(world - ah);
    let aj = ai * zoomScale;
    let ak = max(0.5, 1.0 * zoomScale);
    let al = 1.0 - smoothstep(0.0, 1.0, (aj - ak + 0.5));
    ad = mix(dotBase, ag, al);
  }
  // 内容叠底:ad*(1-contentAlpha) + contentRGB
  let b = ad * (1.0 - am.a) + am.rgb;
  let withGrid = gridLines(b, world, gridData.x);
  return vec4<f32>(withGrid, 1.0);
}

</script></body></html>
