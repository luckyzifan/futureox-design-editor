<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { font-family: system-ui, sans-serif; margin: 12px; display: grid; gap: 8px; }
    button { padding: 6px 10px; }
    #out { min-height: 18px; font-size: 12px; color: #444; }
  </style>
</head>
<body>
  <button id="create">创建 Hello 卡片</button>
  <button id="count">统计当前页节点数</button>
  <button id="close">关闭插件</button>
  <div id="out"></div>
  <script>
    var out = document.getElementById('out')
    out.textContent = 'UI 脚本已运行'
    document.getElementById('create').onclick = function () {
      parent.postMessage({ pluginMessage: { type: 'create-card' } }, '*')
    }
    document.getElementById('count').onclick = function () {
      parent.postMessage({ pluginMessage: { type: 'count' } }, '*')
    }
    document.getElementById('close').onclick = function () {
      parent.postMessage({ pluginMessage: { type: 'close' } }, '*')
    }
    onmessage = function (event) {
      var msg = event.data && event.data.pluginMessage
      if (!msg) return
      if (msg.type === 'created') out.textContent = '已创建节点 ' + msg.id + '，子节点 ' + msg.children + ' 个'
      if (msg.type === 'count') out.textContent = '当前页 ' + msg.nodes + ' 个根节点'
    }
  </script>
</body>
</html>
