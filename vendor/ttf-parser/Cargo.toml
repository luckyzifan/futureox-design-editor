[package]
edition = "2018"
rust-version = "1.63.0"
name = "ttf-parser"
version = "0.25.1"
authors = [
    "Caleb Maclennan <caleb@alerque.com>",
    "Laurenz Stampfl <laurenz.stampfl@gmail.com>",
    "Yevhenii Reizner <razrfalcon@gmail.com>",
    "خالد حسني (Khaled Hosny) <khaled@aliftype.com>",
]
build = false
exclude = ["benches/**"]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A high-level, safe, zero-allocation font parser for TrueType, OpenType, and AAT."
documentation = "https://docs.rs/ttf-parser/"
readme = "README.md"
keywords = [
    "ttf",
    "truetype",
    "opentype",
]
categories = ["parser-implementations"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/harfbuzz/ttf-parser"

[package.metadata.typos.default]
locale = "en-us"

[package.metadata.typos.default.extend-words]
loca = "loca"
ot = "ot"
trak = "trak"
wdth = "wdth"

[lib]
name = "ttf_parser"
path = "src/lib.rs"

[dependencies.core_maths]
version = "0.1.0"
optional = true

[features]
apple-layout = []
default = [
    "std",
    "opentype-layout",
    "apple-layout",
    "variable-fonts",
    "glyph-names",
]
glyph-names = []
gvar-alloc = ["std"]
no-std-float = ["core_maths"]
opentype-layout = []
std = []
variable-fonts = []
