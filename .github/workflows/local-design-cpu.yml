name: Local design CPU and host contracts
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: local-design-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  local-cpu:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      VITEST_MAX_WORKERS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'
      - name: Install pinned Rust and WASM target
        shell: bash
        run: rustup toolchain install 1.96.0 --profile minimal --target wasm32-unknown-unknown
      - name: Install exact WASM bindings tool
        shell: bash
        run: cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Install locked frontend dependencies
        working-directory: frontend/design-client
        run: bun install --frozen-lockfile
      - name: Install pinned real-font fixture generator
        run: python -m pip install --requirement testing/font-fixtures-requirements.txt
      - name: Build this checkout's portable WASM
        shell: bash
        run: python design-studio/scripts/build-web.py --profile dev
      - name: Run portable suites, preserving actual skips and failures
        run: node testing/verify-local.mjs --profile portable --output test-results/portable
      - name: Build native CPU processes from this checkout
        shell: bash
        run: |
          cargo build --locked --manifest-path design-studio/Cargo.toml -p futureox-design-kernel --bin design-prepare
          cargo build --locked --manifest-path design-studio/Cargo.toml -p futureox-design-desktop-backend --bin futureox-design-desktop-backend
      - name: Run real native CPU and SQLite suites
        run: node testing/verify-local.mjs --profile native --output test-results/native
      - name: Retain logs even when a suite fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-design-${{ matrix.os }}-${{ github.sha }}
          path: test-results/
          if-no-files-found: warn
# This workflow deliberately does not call browser/GPU or socket integration.
# A green matrix proves only the executed CPU/host suites on the named runners.
# Real desktop UI, native dialogs, driver readback, package/signing and visual
# parity remain separate release-acceptance gates documented in testing/README.md.
