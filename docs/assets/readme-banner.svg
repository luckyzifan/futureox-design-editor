<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">Futureox Design</title>
  <desc id="description">A local-first canvas, built in the open. An indigo Futureox mark and original vector path artwork on a dark background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101827"/>
      <stop offset="1" stop-color="#1C2345"/>
    </linearGradient>
    <linearGradient id="card" x1="850" y1="80" x2="1150" y2="270" gradientUnits="userSpaceOnUse">
      <stop stop-color="#455DBD" stop-opacity=".65"/>
      <stop offset="1" stop-color="#9B89EC" stop-opacity=".16"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#C7D2FF" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="360" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="360" fill="url(#background)"/>
    <rect x="740" width="540" height="360" fill="url(#grid)"/>
    <circle cx="1160" cy="40" r="250" fill="#5266D9" fill-opacity=".07"/>
    <circle cx="1070" cy="370" r="200" fill="#9080E5" fill-opacity=".06"/>
    <g transform="translate(52 52) scale(.15)">
      <path d="M140 36H372A104 104 0 0 1 476 140V372A104 104 0 0 1 372 476H140A104 104 0 0 1 36 372V140A104 104 0 0 1 140 36Z" fill="#3459D4"/>
      <path d="M118 108C176 70 336 70 394 108C352 128 160 128 118 108Z" fill="#FFFFFF" fill-opacity=".2"/>
      <path d="M186 181V331" fill="none" stroke="#FFFFFF" stroke-width="84" stroke-linecap="round"/>
      <path d="M186 181H330" fill="none" stroke="#FFFFFF" stroke-width="76" stroke-linecap="round"/>
      <path d="M186 288H282" fill="none" stroke="#FFFFFF" stroke-width="70" stroke-linecap="round"/>
    </g>
    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      <text x="150" y="102" fill="#A5B5F6" font-size="16" font-weight="600" letter-spacing="3">TOOLS FOR YOUR IDEAS</text>
      <text x="58" y="185" fill="#F5F7FF" font-size="66" font-weight="700" letter-spacing="-2.5">Futureox <tspan fill="#AAB9FF">Design</tspan></text>
      <text x="62" y="231" fill="#BBC4DD" font-size="25" font-weight="400">A local-first canvas, built in the open.</text>
      <g transform="translate(62 277)" font-size="12" font-weight="600" letter-spacing="1.8">
        <circle cx="4" cy="4" r="4" fill="#A8D9C6"/>
        <text x="20" y="9" fill="#DAE2F4">DESIGN</text>
        <path d="M111-3V12" stroke="#526080"/>
        <text x="133" y="9" fill="#DAE2F4">BUILD</text>
        <path d="M211-3V12" stroke="#526080"/>
        <text x="233" y="9" fill="#DAE2F4">CONTRIBUTE</text>
      </g>
    </g>
    <g transform="rotate(-9 1021 180)">
      <rect x="854" y="70" width="306" height="219" rx="24" fill="#111A32" stroke="#7384C8" stroke-opacity=".35"/>
      <rect x="873" y="90" width="268" height="179" rx="14" fill="url(#card)"/>
      <circle cx="1095" cy="130" r="22" fill="#BADCCB"/>
      <path d="M906 223C931 104 1074 274 1112 173" fill="none" stroke="#E7D7B2" stroke-width="6" stroke-linecap="round"/>
      <path d="M906 223L931 104M1074 274L1112 173" fill="none" stroke="#C6CBF3" stroke-opacity=".65" stroke-width="1.5"/>
      <g fill="#C7CFF8">
        <circle cx="931" cy="104" r="4"/>
        <circle cx="1074" cy="274" r="4"/>
      </g>
      <g fill="#18223E" stroke="#E7D7B2" stroke-width="2.5">
        <rect x="901" y="218" width="10" height="10" rx="1"/>
        <rect x="1107" y="168" width="10" height="10" rx="1"/>
      </g>
    </g>
    <g fill="#18223E" stroke="#AAB9FF" stroke-width="1.5">
      <path d="M834 62H1173V302H834Z" fill="none" stroke-opacity=".5"/>
      <rect x="830" y="58" width="8" height="8"/>
      <rect x="1169" y="58" width="8" height="8"/>
      <rect x="830" y="298" width="8" height="8"/>
      <rect x="1169" y="298" width="8" height="8"/>
    </g>
    <path d="M1182 252L1182 279L1189 273L1195 287L1202 283L1196 270L1206 269Z" fill="#F3F5FF" stroke="#1C2345" stroke-width="2" stroke-linejoin="round"/>
  </g>
</svg>
