[package]
name = "futureox-design-desktop-backend"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
default = []
native-sonic-json = ["futureox-design-kernel/native-sonic-json"]
compact-node-vectors = ["futureox-design-kernel/compact-node-vectors"]
mapped-source-snapshot = ["futureox-design-kernel/mapped-source-snapshot"]

[dependencies]
futureox-design-kernel = { path = "../design-kernel" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
base64.workspace = true
zip.workspace = true
ttf-parser.workspace = true
fs2 = "=0.4.3"
tokio = { workspace = true, features = ["io-util", "io-std", "time"] }
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio"] }

[target.'cfg(windows)'.dependencies]
same-file = "=1.0.6"
