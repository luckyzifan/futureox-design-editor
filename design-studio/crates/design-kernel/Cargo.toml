[package]
name = "futureox-design-kernel"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
native-sonic-json = ["dep:sonic-rs"]
compact-node-vectors = ["dep:thin-vec"]
mapped-source-snapshot = ["dep:rkyv", "dep:memmap2"]

[dependencies]
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
zmij = "1.0.23"
bytemuck = "1.25.2"
thin-vec = { version = "=0.2.19", features = ["serde"], optional = true }
image.workspace = true
png.workspace = true
half.workspace = true
flo_curves.workspace = true
moxcms.workspace = true
base64.workspace = true
ttf-parser.workspace = true
rustybuzz.workspace = true
ouroboros = "=0.18.5"
unicode-bidi.workspace = true
unicode-linebreak.workspace = true
unicode-segmentation.workspace = true
sha2.workspace = true
sha1 = "0.10"
im.workspace = true
either = "1"
lz4_flex.workspace = true
zip.workspace = true
ruzstd.workspace = true
miniz_oxide.workspace = true

# sha2 0.10 gates its runtime-detected ARM SHA-2 instructions behind `asm`.
# Keep the same digest and portable fallback; WASM/x86 dependencies unchanged.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { workspace = true, features = ["asm"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sonic-rs = { version = "=0.5.10", optional = true, default-features = false }
rkyv = { version = "=0.8.18", optional = true, default-features = false, features = ["std", "bytecheck", "little_endian", "unaligned", "pointer_width_64"] }
memmap2 = { version = "=0.9.11", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
js-sys.workspace = true

[[bench]]
name = "raster"
harness = false

[[bench]]
name = "blur"
harness = false

[[bench]]
name = "sample_edges"
harness = false

[[bench]]
name = "fractional_blur"
harness = false

[[bench]]
name = "editing"
harness = false

[[bench]]
name = "sampling"
harness = false

[[bench]]
name = "precision"
harness = false

[[bench]]
name = "editing_frame"
harness = false

[[bench]]
name = "dirty_region"
harness = false

[dev-dependencies]
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std"] }
