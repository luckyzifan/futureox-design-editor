[workspace]
resolver = "2"
members = ["crates/design-kernel", "crates/design-gpu", "crates/design-desktop-backend", "crates/design-agent", "crates/splash-glyph"]

[workspace.package]
edition = "2024"
version = "0.1.0"
publish = false
license = "MIT"

[workspace.dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "fs"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }
sha2 = "0.11"
wasm-bindgen = "=0.2.130"
js-sys = "=0.3.107"
im = "15.1"
lz4_flex = "0.14"
zip = { version = "9.4", default-features = false, features = ["deflate"] }
ruzstd = "0.9"
miniz_oxide = "0.9"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff"] }
png = "0.18.1"
half = "2.7.1"
flo_curves = "0.8.1"
moxcms = { version = "0.9", features = ["extended_range"] }
base64 = "0.23"
ttf-parser = "0.25.1"
rustybuzz = "0.20.1"
unicode-bidi = "0.3.18"
unicode-linebreak = "0.1.5"
unicode-segmentation = "1.13.3"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }

[profile.dev]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1

# Desktop dev iteration (`bun run dev` → build.mjs --fast): keep release-shaped
# artifacts (no debuginfo, stripped) but drop Thin LTO and the single codegen
# unit, which are what make the release build of the kernel take minutes.
# Packaging still builds [profile.release].
[profile.desktop-dev]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 16
incremental = true

[patch.crates-io]
moxcms = { path = "../vendor/moxcms" }

flo_curves = { path = "../vendor/flo_curves" }
